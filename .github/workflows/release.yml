name: Release

# A version tag builds the release files and attaches them to a draft release; the maintainer reviews and
# publishes it. Building and testing run without write access; only the last job, which runs no project code,
# can create the release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build release files
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          ./scripts/New-Release.ps1 -Version $version
          ./scripts/Get-ReleaseNotes.ps1 -Version $version -OutputPath artifacts/release/notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            artifacts/release/*-Setup.exe
            artifacts/release/*-Portable.zip
            artifacts/release/SHA256SUMS.txt
            artifacts/release/notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creating the draft release.
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Create draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Kindly Bartender ${TAG#v}" --notes-file notes.md \
            ./*-Setup.exe ./*-Portable.zip SHA256SUMS.txt
