name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and platform
      placeholder: Version, operating system, and browser or device if relevant
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not include personal information or security vulnerabilities.
